[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allternit-freeweights"
version = "0.1.0"
description = "fw: download, verify and search open AI model weights from Allternit Freeweights"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = []
keywords = ["open-models", "weights", "huggingface", "gguf", "safetensors", "download", "verify"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://freeweights.allternit.com"
Documentation = "https://freeweights.allternit.com/docs/fw"
Source = "https://github.com/Allternit/freeweights"
Issues = "https://github.com/Allternit/freeweights/issues"

[project.scripts]
fw = "freeweights_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["freeweights_cli"]

[tool.hatch.build.targets.wheel.force-include]
"spec/keys/freeweights-v0.pub" = "freeweights_cli/keys/freeweights-v0.pub"

[tool.hatch.build.targets.sdist]
include = ["freeweights_cli", "scripts/fw.py", "spec/keys/freeweights-v0.pub", "README.md", "LICENSE", "pyproject.toml"]
