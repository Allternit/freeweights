    get:
      tags: [allternit]
      operationId: getPaper
      security: [{}, {fwBearer: []}]
      parameters: [{$ref: '#/components/parameters/arxivId'}]
      responses:
        '200': {description: Paper with linked repos., content: {application/json: {schema: {$ref: '#/components/schemas/Paper'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/fw/v1/papers/{arxivId}/vote:
    parameters: [{$ref: '#/components/parameters/arxivId'}]
