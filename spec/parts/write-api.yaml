                max_replicas: {type: integer, minimum: 1}
      responses:
        '200': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Endpoint'}}}}
        '402': {$ref: '#/components/responses/PerkRequired'}
  /api/fw/v1/endpoints/{endpointId}:
    parameters:
      - {name: endpointId, in: path, required: true, schema: {type: string}}
