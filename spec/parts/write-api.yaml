      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: {type: object, required: [newTitle], properties: {newTitle: {$ref: '#/components/schemas/DiscussionEvent'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/{repoType}/{namespace}/{repo}/discussions/{num}/merge:
    post:
      tags: [community]
      operationId: mergePullRequest
      summary: Merge a pull request into main. Repo write access needed. Merged files are scanned like any commit.
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/num'
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {comment: {type: string}}}
      responses:
        '200': {description: Merged.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/{repoType}/{namespace}/{repo}/like:
    post:
      tags: [community]
      operationId: likeRepo
