openapi: 3.1.0
info:
  title: Freeweights hub write API (part)
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Write API for Freeweights accounts. A part of spec/hub-api.yaml (listed there under `x-parts`); it is a
    full OpenAPI 3.1 document of its own so it can be read and checked alone. Account rules, the token
    model, the entitlement claim and privacy are in spec/accounts-v1.md.

    The routes are compatible with the Hugging Face Hub where the Hub has a route, with the request and
    response shapes the `huggingface_hub` client sends and reads, so `HF_ENDPOINT=https://freeweights.allternit.com`
    with an Allternit key (`HF_TOKEN=alt_...`) works for create, upload, commit, discussions, likes,
    collections and webhooks. Routes under `/api/fw/v1/` are Allternit-only.

    ## Auth
    Every route here needs `Authorization: Bearer <credential>`, where the credential is a Clerk session
    JWT (the site, Desktop, web) or an Allternit key with the `alt_` prefix (tools, CLI, scripts). Tokens
    with the `hf_` prefix are refused with 401 `hf_token_rejected`. Every reply on these routes (success or
    error) carries `Cache-Control: private, no-store`, `Content-Security-Policy: default-src 'none';
    frame-ancestors 'none'; base-uri 'none'; form-action 'none'`, `X-Content-Type-Options: nosniff` and
    `Referrer-Policy: no-referrer`.

    Each route answers only the methods listed here; any other method answers 405 `method_not_allowed` with
    `Allow`. A CORS preflight lists the route's methods and allows `Authorization`. A route whose handler is
    not built yet checks the credential, then answers 501 `not_implemented`.

    Scopes: `freeweights.read` (read private repos the caller can see), `freeweights.write` (every write),
    `freeweights.repo:<repo id>` (writes to that one repo only). A Clerk session has read and write.

    ## Repo types in paths
    `{repoType}` is `models`, `datasets` or `spaces`, as Hugging Face clients send it. Freeweights calls a
    space an app (MCP app); `apps` is accepted as an alias of `spaces` everywhere.

    ## Xet
    Freeweights does not run a Xet server. The write-token route answers 501 `xet_not_supported`, and
    uploads must set `HF_HUB_DISABLE_XET=1` (the client then uses the LFS routes below).

    ## Launch limits and scanning
    Uploads are bounded by the operator's `limits` table (spec/accounts-v1.md section 11): an on/off switch,
    a site byte cap, a per-account byte cap, a per-file cap and rate limits. No number is built into this
    spec or the code; `GET /api/fw/v1/limits` reads the values in force. Every uploaded file is scanned before
    anyone can download it. Private repos are not offered yet: asking for one answers 402 `perk_required`.

    ## Signed routes
    `/api/fw/v1/scan/*` (the scanner) and `/api/fw/v1/admin/*` (the operator) take no Bearer credential. They
    are signed with HMAC-SHA256 (`X-FW-Timestamp`, `X-FW-Signature`; spec/accounts-v1.md 11.4), with the
    `SCANNER_SECRET` and `ADMIN_SECRET` keys. `GET /api/fw/v1/scan/health` and `GET /api/fw/v1/limits` are
    public.

    ## Not configured
    Until the accounts database exists, every route here answers 503 `accounts_not_configured`. Public
    reads and downloads (spec/hub-api.yaml) never need an account.
servers:
  - url: https://freeweights.allternit.com
    description: Production
security:
  - fwBearer: []
tags:
  - name: identity
  - name: repos
  - name: upload
  - name: community
  - name: webhooks
  - name: allternit
    description: Allternit-only routes (/api/fw/v1). Stubs; shapes are the contract, handlers land in later waves.
  - name: scanner
    description: The upload scanner on allternit-standby (HMAC SCANNER_SECRET). It holds no R2 or Cloudflare credential.
  - name: admin
    description: Operator routes for scripts/fw_admin.py (HMAC ADMIN_SECRET).
paths:
  # ---------------------------------------------------------------------------------------------- identity
  /api/whoami-v2:
    get:
      tags: [identity]
      operationId: whoamiV2
      summary: Who the credential belongs to (Hugging Face shape, plus the Allternit plan).
      description: |
        Always reads the entitlement claim (also for a Clerk session), so it answers 503 while no claim can be
        verified (`accounts_not_configured`) or cloud-api is down (`entitlement_unavailable`).
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhoAmI'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Signed in but no Freeweights profile yet (profile_not_found). Pick a handle with POST /api/fw/v1/account., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Over the account's api_requests_5m perk (rate_limited). Retry-After says when the window resets., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/NotConfigured'}

  # ------------------------------------------------------------------------------------------------- repos
  /api/repos/create:
    post:
      tags: [repos]
      operationId: createRepo
      summary: Create a repo. 409 if it exists (clients with exist_ok treat 409 as success).
      description: |
        Community repos only: a model or dataset under the caller's own handle (org namespaces and `app` repos
        answer 403 `forbidden` for now). Needs a Freeweights handle, accepted upload rules and an open upload
        switch (staff bypass). Counted against `repos_per_user` (403 `repo_limit`) and `repo_creates_per_day`
        (429 `rate_limited`). `private: true` or `visibility: private` answers 402 `perk_required` (perk
        `private_storage`). A new repo is `draft` until its first commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRepoRequest'}
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateRepoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PerkRequired'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /api/repos/delete:
    delete:
      tags: [repos]
      operationId: deleteRepo
      summary: Delete a repo. Its files leave R2; likes, discussions and collection items for it are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                organization: {type: [string, 'null'], description: Namespace; null or absent = the caller.}
                type: {$ref: '#/components/schemas/RepoTypeSingular'}
      responses:
        '200': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/repos/move:
    post:
      tags: [repos]
      operationId: moveRepo
      summary: Rename or move a repo to another namespace the caller can write. The repo id (rp_...) does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromRepo, toRepo]
              properties:
                fromRepo: {type: string, description: namespace/name}
                toRepo: {type: string, description: namespace/name}
                type: {$ref: '#/components/schemas/RepoTypeSingular'}
      responses:
        '200': {description: Moved.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/{repoType}/{namespace}/{repo}/settings:
    put:
      tags: [repos]
      operationId: updateRepoSettings
      summary: Change visibility, gating or discussions. Making a repo private needs the private-storage perk.
      description: |
        Private repos are not offered yet, so `visibility: private` (or `private: true`) answers 402
        `perk_required` with perk `private_storage`.
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                visibility: {type: string, enum: [public, private]}
                private: {type: boolean, description: Older clients send this instead of visibility.}
                gated: {enum: [auto, manual, false]}
                discussionsDisabled: {type: boolean}
      responses:
        '200': {description: Updated.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PerkRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------------------------------------ upload
  /api/{repoType}/{namespace}/{repo}/preupload/{rev}:
    post:
      tags: [upload]
      operationId: preupload
      summary: Ask which files go through LFS. Files over 10 MB, binary files and files matched by .gitattributes LFS rules are lfs.
      description: |
        Also the first place the launch limits answer, before any byte moves (spec/accounts-v1.md 11.2): more
        than `files_per_commit` files answers 400 `too_many_files`; an executable or archive (by extension or
        by the magic bytes in `sample`) answers 400 `file_type_not_allowed`; a file over `file_max_bytes`
        answers 413 `file_too_large`; a request whose new bytes would pass the caller's `user_cap_bytes`
        answers 413 `storage_full`, or the site's `site_cap_bytes` 413 `site_full`. The error body names every
        refused path in `paths`. Uploads switched off answer 403 `uploads_paused`.
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/rev'
        - $ref: '#/components/parameters/createPr'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [path, sample, size]
                    properties:
                      path: {type: string}
                      sample: {type: string, contentEncoding: base64, description: First 512 bytes, base64.}
                      size: {type: integer, minimum: 0}
                gitAttributes: {type: string}
                gitIgnore: {type: string}
      responses:
        '200':
          description: Upload mode per file.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, uploadMode, shouldIgnore]
                      properties:
                        path: {type: string}
                        uploadMode: {type: string, enum: [lfs, regular]}
                        shouldIgnore: {type: boolean}
                        oid: {type: string, description: Present when a file with this path already exists at rev (git blob sha1 or LFS sha256).}
                  commitOid: {type: string}
        '400': {$ref: '#/components/responses/UploadRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /{namespace}/{repo}.git/info/lfs/objects/batch:
    post:
      tags: [upload]
      operationId: lfsBatchModel
      summary: Git LFS batch API for model repos. Returns presigned R2 URLs (basic PUT, or multipart parts).
      description: |
        New objects land in the quarantine bucket at `repos/<repo id>/blobs/<sha256>`. `basic` (one presigned
        PUT that signs `content-length`) is used up to 64 MiB (67108864 bytes); larger objects get `multipart`
        with `header.chunk_size` = 33554432 (32 MiB) and numbered part URLs ("00001", "00002", ...). After the
        PUTs the client POSTs the completion body to `upload.href` (multipart) and calls `verify.href`.
        Objects already stored for this repo come back with no actions. Presigned URLs last 1 hour; an upload
        not verified by then expires and its bytes are released.

        Each new object's bytes are reserved here, in one conditional D1 statement that checks
        `file_max_bytes`, the caller's `user_cap_bytes` and the site's `site_cap_bytes` together (bytes in
        quarantine, held or live all count). A refused object gets a per-object `error` and no actions:
        code 413 (`file_too_large`) or 507 (`storage_full` or `site_full`, named in `message`). A hash on the
        takedown blocklist gets code 451. The batch as a whole answers 403 `uploads_paused` or
        `rules_not_accepted` when those apply.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
      requestBody: {$ref: '#/components/requestBodies/LfsBatch'}
      responses:
        '200': {$ref: '#/components/responses/LfsBatch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /{lfsPrefix}/{namespace}/{repo}.git/info/lfs/objects/batch:
    post:
      tags: [upload]
      operationId: lfsBatchTyped
      summary: Git LFS batch API for dataset and app repos (same contract as model repos).
      parameters:
        - {name: lfsPrefix, in: path, required: true, schema: {type: string, enum: [datasets, spaces, apps]}}
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
      requestBody: {$ref: '#/components/requestBodies/LfsBatch'}
      responses:
        '200': {$ref: '#/components/responses/LfsBatch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /api/fw/v1/lfs/{uploadId}/complete:
    post:
      tags: [upload]
      operationId: lfsMultipartComplete
      summary: Multipart completion (the `upload.href` of a multipart action). Same body Hugging Face clients send.
      parameters:
        - {name: uploadId, in: path, required: true, schema: {type: string, pattern: '^up_[0-9A-Za-z]+$'}}
      requestBody:
        required: true
        content:
          application/vnd.git-lfs+json:
            schema:
              type: object
              required: [oid, parts]
              properties:
                oid: {$ref: '#/components/schemas/Sha256'}
                parts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: {type: integer, minimum: 1}
                      etag: {type: string}
      responses:
        '200': {description: Upload complete.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/SizeMismatch'}
  /api/fw/v1/lfs/{uploadId}/verify:
    post:
      tags: [upload]
      operationId: lfsVerify
      summary: LFS verify (the `verify.href` of an action). Checks the stored object's size.
      description: |
        The Worker HEADs the quarantine object. A size that differs from the reserved size deletes the object,
        releases its bytes and answers 422 `size_mismatch`. The sha256 is checked by the scanner (the file is
        held with `sha256_mismatch` when it differs), not here.
      parameters:
        - {name: uploadId, in: path, required: true, schema: {type: string, pattern: '^up_[0-9A-Za-z]+$'}}
      requestBody:
        required: true
        content:
          application/vnd.git-lfs+json:
            schema:
              type: object
              required: [oid, size]
              properties:
                oid: {$ref: '#/components/schemas/Sha256'}
                size: {type: integer, minimum: 0}
      responses:
        '200': {description: Verified.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/SizeMismatch'}
  /api/{repoType}/{namespace}/{repo}/commit/{rev}:
    post:
      tags: [upload]
      operationId: createCommit
      summary: Create a commit from an NDJSON body. The first line is the header; each other line is one operation.
      description: |
        Every `lfsFile` must have been uploaded and verified for this repo. After the commit the repo goes
        to `scanning` and one `scans` row is queued per new file; new files are scanned before they are served
        (state `live` when every scan of the commit is clean, or `held`). Regular (non-LFS) files in the body
        are stored in quarantine and scanned the same way.
        Limits: `files_per_commit` (400 `too_many_files`), `commits_per_hour` (429 `rate_limited`), the upload
        switch (403 `uploads_paused`). `create_pr=1` answers 501 `not_implemented` for now (no PRs at launch).
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/rev'
        - $ref: '#/components/parameters/createPr'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              description: One JSON object per line; this schema is the shape of one line.
              $ref: '#/components/schemas/CommitLine'
      responses:
        '200':
          description: Committed.
          content:
            application/json:
              schema:
                type: object
                required: [commitOid, commitUrl]
                properties:
                  success: {type: boolean}
                  commitOid: {$ref: '#/components/schemas/CommitOid'}
                  commitUrl: {type: string, format: uri}
                  pullRequestUrl: {type: [string, 'null'], format: uri, description: Set when create_pr=1.}
        '400': {$ref: '#/components/responses/UploadRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: parentCommit is not the head of rev., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /api/{repoType}/{namespace}/{repo}/refs:
    get:
      tags: [upload]
      operationId: listRefs
      summary: Branches (main only), tags (none yet) and pull request refs.
      security: [{}, {fwBearer: []}]
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - {name: include_prs, in: query, schema: {type: integer, enum: [0, 1]}}
      responses:
        '200':
          description: Refs.
          content:
            application/json:
              schema:
                type: object
                required: [branches, converts, tags]
                properties:
                  branches: {type: array, items: {$ref: '#/components/schemas/GitRef'}}
                  converts: {type: array, items: {$ref: '#/components/schemas/GitRef'}, maxItems: 0}
                  tags: {type: array, items: {$ref: '#/components/schemas/GitRef'}}
                  pullRequests: {type: array, items: {$ref: '#/components/schemas/GitRef'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/{repoType}/{namespace}/{repo}/xet-write-token/{rev}:
    get:
      tags: [upload]
      operationId: xetWriteToken
      summary: Not supported. Set HF_HUB_DISABLE_XET=1 so the client uses LFS.
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/rev'
      responses:
        '501':
          description: Xet is not supported.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: xet_not_supported, message: Freeweights takes uploads over Git LFS. Set HF_HUB_DISABLE_XET=1 and retry.}

  # --------------------------------------------------------------------------------------------- community
  /api/{repoType}/{namespace}/{repo}/discussions:
    get:
      tags: [community]
      operationId: listDiscussions
      summary: Discussions and pull requests of a repo (catalog entries included). Public repos need no credential.
      security: [{}, {fwBearer: []}]
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - {name: p, in: query, schema: {type: integer, minimum: 0}}
        - {name: type, in: query, schema: {type: string, enum: [all, discussion, pull_request]}}
        - {name: status, in: query, schema: {type: string, enum: [all, open, closed]}}
        - {name: author, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [discussions, count, start]
                properties:
                  discussions: {type: array, items: {$ref: '#/components/schemas/Discussion'}}
                  count: {type: integer}
                  start: {type: integer}
                  numClosedDiscussions: {type: integer}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [community]
      operationId: createDiscussion
      summary: Open a discussion, or a pull request (an empty refs/pr/<num> the author then commits to).
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 3, maxLength: 200}
                description: {type: [string, 'null']}
                pullRequest: {type: boolean, default: false}
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [num]
                properties:
                  num: {type: integer}
                  url: {type: string, format: uri}
                  pullRequest: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/{repoType}/{namespace}/{repo}/discussions/{num}:
    get:
      tags: [community]
      operationId: getDiscussion
      summary: A discussion with its events.
      security: [{}, {fwBearer: []}]
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/num'
      responses:
        '200':
          description: Details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscussionDetails'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/{repoType}/{namespace}/{repo}/discussions/{num}/comment:
    post:
      tags: [community]
      operationId: commentDiscussion
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/num'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [comment], properties: {comment: {type: string, minLength: 1, maxLength: 65536}}}
      responses:
        '200':
          description: Posted.
          content:
            application/json:
              schema: {type: object, required: [newMessage], properties: {newMessage: {$ref: '#/components/schemas/DiscussionEvent'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/{repoType}/{namespace}/{repo}/discussions/{num}/status:
    post:
      tags: [community]
      operationId: changeDiscussionStatus
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/num'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [open, closed]}
                comment: {type: string}
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: {type: object, required: [newStatus], properties: {newStatus: {$ref: '#/components/schemas/DiscussionEvent'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/{repoType}/{namespace}/{repo}/discussions/{num}/title:
    post:
      tags: [community]
      operationId: renameDiscussion
      parameters:
        - $ref: '#/components/parameters/repoType'
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/repo'
