      operationId: linkPaper
      parameters: [{$ref: '#/components/parameters/arxivId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [repo], properties: {repo: {$ref: '#/components/schemas/RepoPointer'}}}}}}
      responses:
        '200': {description: Linked.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/fw/v1/evals:
    get:
      tags: [allternit]
      operationId: listEvals
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: repo, in: query, required: true, schema: {type: string}, description: 'models/org/repo'}
      responses:
        '200':
          description: Evaluation results for a repo.
          content:
            application/json:
              schema:
                type: object
                required: [repo, results]
                properties:
                  repo: {type: string}
                  results:
                    type: array
                    items:
                      type: object
                      required: [task, dataset, metric, value, source, verified]
                      properties:
                        task: {type: string}
                        dataset: {type: string}
                        metric: {type: string}
                        value: {type: number}
                        source: {type: string, enum: [card, run, submitted]}
                        verified: {type: boolean, description: True only when Freeweights or a named third party re-ran it.}
                        url: {type: string, format: uri}
  /api/fw/v1/apps:
    get:
      tags: [allternit]
      operationId: listAppsForModel
      summary: MCP apps that use a model (read from the apps registry; D11).
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: model, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Apps.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, runs]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    description: {type: string}
                    runs: {type: string, enum: [static, server], description: 'static = sandbox in the browser; server = a process in a Guard environment on the user''s own computer'}
                    open_url: {type: string, format: uri}
  /api/fw/v1/endpoints:
    get:
      tags: [allternit]
      operationId: listEndpoints
      responses:
        '200': {description: The caller's inference endpoints., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}}}}
    post:
      tags: [allternit]
      operationId: createEndpoint
      summary: Create an endpoint for a repo, paid from prepaid credits. Costs are shown by cloud-api, not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, hardware]
              properties:
                repo: {$ref: '#/components/schemas/RepoPointer'}
