      parameters:
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200': {description: Papers., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Paper'}}}}}
