      tags: [allternit]
      operationId: deleteEndpoint
      responses:
        '200': {description: Deleted.}
  /api/fw/v1/reports:
    post:
      tags: [allternit]
      operationId: createReport
      summary: Report content. Legal notices without an account go to the takedown mailbox instead (docs/takedowns).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, reason_class]
              properties:
                target:
                  type: object
                  required: [type, id]
                  properties:
                    type: {type: string, enum: [user, org, repo, discussion, comment, post, collection, paper]}
                    id: {type: string}
                reason_class: {type: string, enum: [copyright, csam, real_person_likeness, crime_marketing, malware_or_secrets, license_violation, spam, abuse, other]}
                body: {type: string, maxLength: 5000}
      responses:
        '200': {description: Received., content: {application/json: {schema: {type: object, required: [id, status], properties: {id: {type: string}, status: {type: string, enum: [open]}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ------------------------------------------------------------------------------------- launch limits
  /api/fw/v1/limits:
    get:
      tags: [allternit]
      operationId: getLimits
      summary: The upload limits in force, the site total and whether scanning is delayed. Public; a credential is ignored.
      description: |
        Read from the `limits` table at request time (spec/accounts-v1.md 11.1); no number is built in. A cap
        whose key is unset reads null, and `open` is then false. `Cache-Control: public, max-age=60`.
      security: [{}]
      responses:
        '200':
          description: Limits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Limits'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /api/fw/v1/repos:
    get:
      tags: [allternit]
      operationId: listMyRepos
      summary: The caller's community repos in every state, with scan progress. The account page and the upload UIs read it.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [model, dataset]}}
      responses:
        '200':
          description: Repos, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos: {type: array, items: {$ref: '#/components/schemas/MyRepo'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Signed in but no Freeweights profile yet (profile_not_found)., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/NotConfigured'}

  # ------------------------------------------------------------------------------------------- scanner
  /api/fw/v1/scan/claim:
    post:
      tags: [scanner]
      operationId: scanClaim
      summary: Claim the next scan jobs, record the scanner's heartbeat and run the sweep. Polled every 30 to 60 seconds.
      description: |
        Each poll writes `scanner_state.last_poll_at`, then sweeps (spec/accounts-v1.md 11.5): pending uploads
        older than 1 hour expire and release their bytes; a claim past `claimed_until` goes back to `queued`, or
        to `error` after its third attempt; held files older than 14 days are deleted from quarantine and their
        bytes released. Then up to `max` queued scans (oldest first) are claimed: status `scanning`,
        `attempts` + 1, `claimed_until` = now + 30 minutes. Each job carries a presigned GET on its quarantine
        object, valid 15 minutes. No job is an empty `jobs` list, not an error.
      security: [{fwScanner: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scanner_version]
              properties:
                scanner_version: {type: string, maxLength: 100}
                max: {type: integer, minimum: 1, maximum: 10, default: 1}
      responses:
        '200':
          description: Jobs (possibly none) and what the sweep did.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, sweep]
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/ScanJob'}}
                  sweep: {$ref: '#/components/schemas/ScanSweep'}
        '401': {$ref: '#/components/responses/BadSignature'}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /api/fw/v1/scan/{scanId}/result:
    post:
      tags: [scanner]
      operationId: scanResult
      summary: Report one scan's result. Clean files are promoted; the repo goes live when every scan of its commit is clean.
      description: |
        Accepted only while the scan is `scanning` and `attempt` equals its `attempts` (a result for a claim
        that ran out answers 409 `scan_not_claimed`). Any finding means `held`. A sha256 on `blocked_hashes`
        is held with `blocklisted` whatever the scanner said. On `clean` the Worker copies the object from
        quarantine to the public bucket at the same key, then deletes the quarantine copy (U8). When every scan
        of the commit is clean the repo goes `live`; one held scan makes the repo `held` and nothing of that
        commit is served. `error` puts the scan back to `queued` until its third attempt, then leaves it
        `error` (the repo stays `scanning`; an admin decides). Sending the same result twice is harmless.
      security: [{fwScanner: []}]
      parameters:
        - {name: scanId, in: path, required: true, schema: {type: string, pattern: '^sc_[0-9A-Za-z]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScanResultBody'}
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, repo_status]
                properties:
                  id: {type: string}
                  status: {$ref: '#/components/schemas/ScanStatus'}
                  repo_status: {type: string, enum: [draft, scanning, live, held, removed]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/BadSignature'}
        '404': {description: No such scan (scan_not_found)., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: The scan is not claimed under this attempt (scan_not_claimed)., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/NotConfigured'}
  /api/fw/v1/scan/health:
    get:
      tags: [scanner]
      operationId: scanHealth
      summary: 200 when the scanner polled in the last 10 minutes, else 503. Public; status.allternit.com and the upload UIs read it.
      security: [{}]
      responses:
        '200': {description: Scanner is polling., content: {application/json: {schema: {$ref: '#/components/schemas/ScanHealth'}}}}
        '503': {description: 'Scanner is late or never polled (the upload UIs show "Scanning is delayed"), or accounts are not configured.', content: {application/json: {schema: {$ref: '#/components/schemas/ScanHealth'}}}}

  # --------------------------------------------------------------------------------------------- admin
  /api/fw/v1/admin/reports:
    get:
      tags: [admin]
      operationId: adminListReports
      security: [{fwAdmin: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, actioned, rejected], default: open}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Reports, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports: {type: array, items: {$ref: '#/components/schemas/AdminReport'}}
                  next: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/BadSignature'}
  /api/fw/v1/admin/reports/{reportId}:
    post:
      tags: [admin]
      operationId: adminResolveReport
      summary: Close a report. Removing the content is a separate call (repos/{repoId}/remove).
      security: [{fwAdmin: []}]
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, pattern: '^rpt_[0-9A-Za-z]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [actioned, rejected]}
                resolution: {type: string, maxLength: 2000}
      responses:
        '200': {description: Updated., content: {application/json: {schema: {$ref: '#/components/schemas/AdminReport'}}}}
        '401': {$ref: '#/components/responses/BadSignature'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/fw/v1/admin/held:
    get:
      tags: [admin]
      operationId: adminListHeld
      summary: Held and errored scans with their findings, oldest first. Held files are deleted 14 days after the scan.
      security: [{fwAdmin: []}]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Held scans.
          content:
            application/json:
              schema:
                type: object
                required: [scans]
                properties:
                  scans: {type: array, items: {$ref: '#/components/schemas/HeldScan'}}
                  next: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/BadSignature'}
  /api/fw/v1/admin/repos/{repoId}/remove:
    post:
      tags: [admin]
      operationId: adminRemoveRepo
      summary: Take a repo down. Its files stop being served at once; presigned links already handed out end within 5 minutes.
      description: |
        Sets `status = removed` and `removed_reason = <reason_class>`; resolve then answers 451
        `removed_after_takedown`. With `blocklist: true` every file hash of the repo goes into
        `blocked_hashes`, so the same bytes are refused on any later upload, and the reply lists them so
        fw_admin.py can add them to the public or private blocklist file (scripts/blocklist.py decides which).
        The files stay in R2 until `purge` is sent (kept for an appeal or a counter-notice).
      security: [{fwAdmin: []}]
      parameters:
        - {name: repoId, in: path, required: true, schema: {type: string, pattern: '^rp_[0-9A-Za-z]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_class]
              properties:
                reason_class: {type: string, enum: [copyright, csam, ncii, personal_data, real_person_likeness, crime_marketing, malware_or_secrets, license_violation, publisher_request, spam, abuse, other]}
                report_id: {type: string, pattern: '^rpt_[0-9A-Za-z]+$', description: Marks that report actioned.}
                blocklist: {type: boolean, default: false}
                purge: {type: boolean, default: false, description: Also delete the files from R2 and release their bytes.}
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, sha256]
                properties:
                  id: {type: string}
                  status: {type: string, enum: [removed]}
                  sha256: {type: array, items: {$ref: '#/components/schemas/Sha256'}, description: File hashes of the repo (added to blocked_hashes when blocklist was true).}
                  purged: {type: boolean, description: True when purge was sent and every file is deleted. Send the call again while it is false (a bounded number of files go per call).}
                  static_paths: {type: array, items: {type: string}, description: Paths of the community detail page. The Worker deletes the R2 page (404 on Cloud Connector paths); the caller purges these from the edge cache.}
        '401': {$ref: '#/components/responses/BadSignature'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/fw/v1/admin/repos/{repoId}/restore:
    post:
      tags: [admin]
      operationId: adminRestoreRepo
      summary: Undo a removal (an appeal or a counter-notice), or release a held repo after review.
      description: |
        A removed repo goes back to `live` when every scan of its head is clean, else to `held`. A held repo
        whose findings an admin reviewed as false positives goes `live` with `release_held: true`: its held
        scans are marked clean and promoted. Hashes are taken off `blocked_hashes` only with
        `unblock: true`. A purged repo cannot be restored (409 `conflict`).
      security: [{fwAdmin: []}]
      parameters:
        - {name: repoId, in: path, required: true, schema: {type: string, pattern: '^rp_[0-9A-Za-z]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                release_held: {type: boolean, default: false}
                unblock: {type: boolean, default: false}
                note: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: {type: object, required: [id, status], properties: {id: {type: string}, status: {type: string, enum: [live, held, scanning]}}}
        '401': {$ref: '#/components/responses/BadSignature'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/fw/v1/admin/users/{handle}:
    post:
      tags: [admin]
      operationId: adminUpdateUser
      summary: Suspend or reinstate an account, or set its staff flag (staff may upload while uploads are switched off).
      description: |
        A suspended account's writes answer 403 `account_suspended`. Its live repos stay served unless removed
        one by one. Every change is written to audit_log.
      security: [{fwAdmin: []}]
      parameters:
        - {name: handle, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: {type: string, enum: [active, suspended]}
                staff: {type: boolean}
                note: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {type: object, required: [id, handle, status, staff], properties: {id: {type: string}, handle: {type: string}, status: {type: string, enum: [active, suspended, deleted]}, staff: {type: boolean}}}
        '401': {$ref: '#/components/responses/BadSignature'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/fw/v1/admin/limits:
    get:
      tags: [admin]
      operationId: adminGetLimits
      summary: Every row of the limits table, with who set it and when.
      security: [{fwAdmin: []}]
      responses:
        '200':
          description: Limit rows.
          content:
            application/json:
              schema:
                type: object
                required: [limits]
                properties:
                  limits:
                    type: array
                    items: {type: object, required: [key, value, updated_at], properties: {key: {type: string}, value: {type: integer, minimum: 0}, updated_by: {type: [string, 'null']}, updated_at: {type: string, format: date-time}}}
        '401': {$ref: '#/components/responses/BadSignature'}
    put:
      tags: [admin]
      operationId: adminSetLimit
      summary: Set one limit. Takes effect on the next request; no deploy.
      description: Unknown keys are refused (400) so a typo cannot pass silently. `uploads_open` takes 0 or 1.
      security: [{fwAdmin: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: {$ref: '#/components/schemas/LimitKey'}
                value: {type: integer, minimum: 0}
      responses:
        '200': {description: Set. The reply is the new GET /api/fw/v1/limits body., content: {application/json: {schema: {$ref: '#/components/schemas/Limits'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/BadSignature'}
  /api/fw/v1/admin/usage/reconcile:
    post:
      tags: [admin]
      operationId: adminReconcileUsage
      summary: Recompute storage_usage and the site total from uploads and repos, and say what changed.
      security: [{fwAdmin: []}]
      responses:
        '200':
          description: Reconciled.
          content:
            application/json:
              schema:
                type: object
                required: [site_bytes_before, site_bytes_after, owners_changed]
                properties:
                  site_bytes_before: {type: integer}
                  site_bytes_after: {type: integer}
                  owners_changed: {type: integer}
        '401': {$ref: '#/components/responses/BadSignature'}
  /api/fw/v1/admin/r2-usage:
    get:
      tags: [admin]
      operationId: adminR2Usage
      summary: Bytes and object counts of the buckets bound to the Worker (freeweights, quarantine, private), summed from listings.
      description: |
        The Worker cannot see the R2 account total; fw_admin.py adds the other buckets (allternit-runtime) with
        the Cloudflare API on the operator's machine. A large bucket is listed in pages: pass the returned
        `cursor` until it is null.
      security: [{fwAdmin: []}]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Per-bucket totals so far.
          content:
            application/json:
              schema:
                type: object
                required: [buckets, cursor]
                properties:
                  buckets:
                    type: array
                    items: {type: object, required: [binding, bytes, objects, complete], properties: {binding: {type: string, enum: [FW, QUARANTINE, PRIVATE]}, bytes: {type: integer}, objects: {type: integer}, complete: {type: boolean}}}
                  cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/BadSignature'}

components:
  securitySchemes:
    fwBearer:
      type: http
      scheme: bearer
      description: A Clerk session JWT or an Allternit key (alt_ prefix). hf_ tokens are refused. See spec/accounts-v1.md.
    fwScanner:
      type: apiKey
      in: header
      name: X-FW-Signature
      description: 'HMAC-SHA256 with SCANNER_SECRET over "<X-FW-Timestamp>\n<METHOD>\n<path and query>\n<sha256 hex of the body>", sent as "v1=<hex>". The timestamp (Unix seconds) must be within 300 seconds of the Worker clock. spec/accounts-v1.md 11.4.'
    fwAdmin:
      type: apiKey
      in: header
      name: X-FW-Signature
      description: Same scheme as fwScanner, keyed with ADMIN_SECRET.
  parameters:
    repoType: {name: repoType, in: path, required: true, schema: {type: string, enum: [models, datasets, spaces, apps]}}
    namespace: {name: namespace, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
    repo: {name: repo, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,96}$'}}
    rev: {name: rev, in: path, required: true, description: 'main, refs/pr/<num> (URL-encoded) or a 40-hex commit.', schema: {type: string}}
    num: {name: num, in: path, required: true, schema: {type: integer, minimum: 1}}
    createPr: {name: create_pr, in: query, schema: {type: integer, enum: [0, 1]}}
    webhookId: {name: webhookId, in: path, required: true, schema: {type: string, pattern: '^wh_[0-9A-Za-z]+$'}}
    arxivId: {name: arxivId, in: path, required: true, schema: {type: string, pattern: '^[0-9]{4}\.[0-9]{4,5}$'}}
  requestBodies:
    LfsBatch:
      required: true
      content:
        application/vnd.git-lfs+json:
          schema:
            type: object
            required: [operation, objects]
            properties:
              operation: {type: string, enum: [upload, download]}
              transfers: {type: array, items: {type: string, enum: [basic, multipart]}}
              objects:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: object
                  required: [oid, size]
                  properties:
                    oid: {$ref: '#/components/schemas/Sha256'}
                    size: {type: integer, minimum: 0}
              hash_algo: {type: string, enum: [sha256]}
              ref: {type: object, properties: {name: {type: string}}}
  responses:
    LfsBatch:
      description: Per-object actions or errors.
      content:
        application/vnd.git-lfs+json:
          schema:
            type: object
            required: [objects]
            properties:
              transfer: {type: string, enum: [basic, multipart]}
              objects:
                type: array
                items:
                  type: object
                  required: [oid, size]
                  properties:
                    oid: {$ref: '#/components/schemas/Sha256'}
                    size: {type: integer}
                    authenticated: {type: boolean}
                    actions:
                      type: object
                      properties:
                        upload:
                          type: object
                          required: [href]
                          properties:
                            href: {type: string, format: uri, description: 'basic: presigned R2 PUT URL. multipart: the completion URL (/api/fw/v1/lfs/{uploadId}/complete).'}
                            header:
                              type: object
                              description: 'multipart only: chunk_size (string of an integer) and one presigned part URL per part, keyed "00001", "00002", ...'
                              additionalProperties: {type: string}
                            expires_in: {type: integer}
                        verify:
                          type: object
                          required: [href]
                          properties:
                            href: {type: string, format: uri}
                            header: {type: object, additionalProperties: {type: string}}
                    error:
                      type: object
                      required: [code, message]
                      properties:
                        code: {type: integer, description: '404 unknown object, 413 over file_max_bytes (file_too_large), 422 bad oid, 451 hash on the takedown blocklist, 507 over the account cap (storage_full) or the site cap (site_full); message names the code'}
                        message: {type: string}
    BadRequest:
      description: The request is malformed.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: No credential, an invalid or expired one, or an hf_ token (hf_token_rejected).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: auth_required, message: Sign in or send an Allternit key (alt_...).}
    Forbidden:
      description: The credential lacks the scope or the role (insufficient_scope, forbidden).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: No such repo, or a private repo the caller cannot see (the two are not told apart).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Already exists, handle taken or reserved, or a merge conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PerkRequired:
      description: The caller's plan or add-ons do not include this (perk_required) or its limit is used (perk_limit). The body names the perk, never a price.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - type: object
                required: [perk]
                properties:
                  perk: {type: string}
                  plans_url: {type: string, format: uri}
    NotConfigured:
      description: Accounts are not turned on for this deployment (accounts_not_configured).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    UploadForbidden:
      description: |
        The upload cannot start: uploads are switched off (uploads_paused), the upload rules are not accepted
        (rules_not_accepted), the account is suspended (account_suspended), the account has its repos_per_user
        repos (repo_limit), or the credential lacks the scope or role (insufficient_scope, forbidden).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    UploadRefused:
      description: Too many files in one commit (too_many_files), a refused file type (file_type_not_allowed), or a malformed request.
      content: {application/json: {schema: {$ref: '#/components/schemas/LimitError'}}}
    TooLarge:
      description: A file over file_max_bytes (file_too_large), or new bytes over the account's cap (storage_full) or the site's cap (site_full).
      content: {application/json: {schema: {$ref: '#/components/schemas/LimitError'}}}
    SizeMismatch:
      description: The stored object's size differs from the size given at the LFS batch (size_mismatch). The object is deleted and its bytes released.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    RateLimited:
      description: Over repo_creates_per_day or commits_per_hour (rate_limited). Retry-After says when to try again.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BadSignature:
      description: Missing, wrong or stale HMAC signature (bad_signature). The body never says which.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string, description: 'Stable code: auth_required, hf_token_rejected, insufficient_scope, forbidden, repo_not_found, repo_exists, handle_taken, account_exists, namespace_reserved, perk_required, perk_limit, xet_not_supported, accounts_not_configured, rate_limited, uploads_paused, rules_not_accepted, account_suspended, repo_limit, too_many_files, file_type_not_allowed, file_too_large, storage_full, site_full, size_mismatch, file_not_ready, removed_after_takedown, bad_signature, scan_not_found, scan_not_claimed, not_implemented.'}
        message: {type: string}
    LimitError:
      allOf:
        - {$ref: '#/components/schemas/Error'}
        - type: object
          properties:
            paths: {type: array, items: {type: string}, description: The refused file paths, when the error is about files.}
            limit: {$ref: '#/components/schemas/LimitKey'}
    LimitKey: {type: string, enum: [uploads_open, site_cap_bytes, user_cap_bytes, file_max_bytes, repos_per_user, repo_creates_per_day, commits_per_hour, files_per_commit, reports_per_day]}
    Limits:
      type: object
      required: [open, limits, site, scanning_delayed]
      properties:
        open: {type: boolean, description: 'True when uploads_open is 1 and every cap key is set. Staff may upload while false.'}
        limits:
          type: object
          description: Each value is the integer in the limits table, or null while unset. Bytes for the *_bytes keys.
          required: [site_cap_bytes, user_cap_bytes, file_max_bytes, repos_per_user, repo_creates_per_day, commits_per_hour, files_per_commit]
          properties:
            site_cap_bytes: {type: [integer, 'null']}
            user_cap_bytes: {type: [integer, 'null']}
            file_max_bytes: {type: [integer, 'null']}
            repos_per_user: {type: [integer, 'null']}
            repo_creates_per_day: {type: [integer, 'null']}
            commits_per_hour: {type: [integer, 'null']}
            files_per_commit: {type: [integer, 'null']}
        site:
          type: object
          required: [used_bytes, cap_bytes, full]
          properties:
            used_bytes: {type: integer, description: Community bytes reserved, in quarantine, held or live.}
            cap_bytes: {type: [integer, 'null']}
            full: {type: boolean, description: True when no file of one byte fits, or the cap is unset.}
        scanning_delayed: {type: boolean, description: True when the scanner has not polled in the last 10 minutes.}
    ScanStatus: {type: string, enum: [queued, scanning, clean, held, error]}
    ScanFinding:
      type: object
      required: [scanner, code]
      properties:
        scanner: {type: string, description: 'e.g. sha256, blocklist, formats, picklescan, modelscan, clamav, gitleaks'}
        code: {type: string, enum: [sha256_mismatch, blocklisted, bad_header, unsafe_pickle, malware, secret_found, scan_failed]}
        detail: {type: string, maxLength: 2000, description: Shown to admins only. Never file content or a secret's value.}
    ScanJob:
      type: object
      required: [id, repo_id, path, sha256, size, file_class, attempt, url, url_expires_at, claimed_until]
      properties:
        id: {type: string, pattern: '^sc_[0-9A-Za-z]+$'}
        repo_id: {type: string}
        commit_oid: {type: [string, 'null']}
        path: {type: string}
        sha256: {$ref: '#/components/schemas/Sha256'}
        size: {type: integer, minimum: 0}
        file_class: {type: string, enum: [weights, pickle, other]}
        attempt: {type: integer, minimum: 1, description: Send it back in the result.}
        url: {type: string, format: uri, description: Presigned GET on the quarantine object, valid 15 minutes.}
        url_expires_at: {type: string, format: date-time}
        claimed_until: {type: string, format: date-time}
    ScanSweep:
      type: object
      required: [expired_uploads, requeued, errored, held_deleted]
      properties:
        expired_uploads: {type: integer}
        requeued: {type: integer}
        errored: {type: integer}
        held_deleted: {type: integer}
    ScanResultBody:
      type: object
      required: [attempt, status, findings, scanner_version]
      properties:
        attempt: {type: integer, minimum: 1}
        status: {type: string, enum: [clean, held, error]}
        findings: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ScanFinding'}, description: Empty for clean. At least one for held.}
        scanner_version: {type: string, maxLength: 100}
    ScanHealth:
      type: object
      required: [ok, last_poll_at, queued, oldest_queued_at]
      properties:
        ok: {type: boolean}
        last_poll_at: {type: [string, 'null'], format: date-time}
        queued: {type: integer, description: Scans queued or being scanned.}
        oldest_queued_at: {type: [string, 'null'], format: date-time}
    MyRepo:
      type: object
      required: [id, type, name, status, bytes, scans]
      properties:
        id: {type: string, description: rp_...}
        type: {type: string, enum: [model, dataset]}
        name: {type: string, description: namespace/name}
        status: {type: string, enum: [draft, scanning, live, held, removed]}
        removed_reason: {type: [string, 'null'], description: Set when removed. A takedown class, owner or account_deleted.}
        head_commit: {type: [string, 'null']}
        bytes: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        scans:
          type: object
          description: Counts for the head commit. Findings are shown to admins only; the owner sees the codes.
          required: [queued, scanning, clean, held, error]
          properties:
            queued: {type: integer}
            scanning: {type: integer}
            clean: {type: integer}
            held: {type: integer}
            error: {type: integer}
            held_codes: {type: array, items: {type: string}}
    AdminReport:
      type: object
      required: [id, target_type, target_id, reason_class, status, createdAt]
      properties:
        id: {type: string}
        reporter: {type: [string, 'null'], description: Handle, or null for a deleted account.}
        target_type: {type: string}
        target_id: {type: string}
        reason_class: {type: string}
        body: {type: [string, 'null']}
        status: {type: string, enum: [open, actioned, rejected]}
        resolution: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    HeldScan:
      type: object
      required: [id, repo_id, repo, path, sha256, status, findings]
      properties:
        id: {type: string}
        repo_id: {type: string}
        repo: {type: string, description: namespace/name}
        path: {type: string}
        sha256: {$ref: '#/components/schemas/Sha256'}
        status: {type: string, enum: [held, error]}
        attempts: {type: integer}
        findings: {type: array, items: {$ref: '#/components/schemas/ScanFinding'}}
        finished_at: {type: [string, 'null'], format: date-time}
        delete_after: {type: [string, 'null'], format: date-time, description: finished_at + 14 days for held files.}
    Handle: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,41}$'}
    Sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    CommitOid: {type: string, pattern: '^[0-9a-f]{40}$'}
    RepoTypeSingular: {type: [string, 'null'], enum: [model, dataset, space, app, null], description: null or absent = model.}
    RepoPointer:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [model, dataset, app]}
        id: {type: string, description: namespace/name}
    UserRef:
      type: object
      required: [user]
      properties:
        user: {type: string}
        fullname: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null']}
        type: {type: string, enum: [user]}
    WhoAmI:
      type: object
      required: [type, id, name, orgs, auth]
      properties:
        type: {type: string, enum: [user]}
        id: {type: string, description: Clerk user id.}
        name: {type: string, description: Handle.}
        fullname: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null']}
        isPro: {type: boolean, description: True when the claim plan is not "free". Hugging Face clients read this field.}
        orgs:
          type: array
          items:
            type: object
            required: [type, name, roleInOrg]
            properties:
              type: {type: string, enum: [org]}
              name: {type: string}
              fullname: {type: [string, 'null']}
              avatarUrl: {type: [string, 'null']}
              roleInOrg: {type: string, enum: [read, contributor, write, admin]}
        auth:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [access_token, session]}
            accessToken:
              type: object
              properties:
                displayName: {type: string}
                role: {type: string, enum: [read, write, fineGrained]}
                fineGrained:
                  type: object
                  properties:
                    scoped:
                      type: array
                      items:
                        type: object
                        properties:
                          entity: {type: object, properties: {type: {type: string}, name: {type: string}}}
                          permissions: {type: array, items: {type: string}}
        allternit:
          type: object
          description: Allternit extension. Plan id and scopes from the entitlement claim; no price.
          properties:
            plan: {type: string}
            scopes: {type: array, items: {type: string}}
    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, pattern: '^[A-Za-z0-9._-]{1,96}$'}
        organization: {type: [string, 'null']}
        type: {$ref: '#/components/schemas/RepoTypeSingular'}
        visibility: {type: string, enum: [public, private], description: Newer clients.}
        private: {type: boolean, description: Older clients.}
        sdk: {type: string, enum: [static, gradio, streamlit, docker, mcp], description: Apps only. gradio/streamlit/docker apps run on the user's own computer (D11).}
        license: {type: string}
    CreateRepoResponse:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri, description: 'https://freeweights.allternit.com/<ns>/<name> (datasets/ or spaces/ prefixed for those kinds).'}
        name: {type: string}
        id: {type: string, description: Stable repo id (rp_...), used in freeweights.repo:<id> scopes.}
    CommitLine:
      oneOf:
        - type: object
          required: [key, value]
          properties:
            key: {const: header}
            value:
              type: object
              required: [summary]
              properties:
                summary: {type: string, minLength: 1, maxLength: 500}
                description: {type: string}
                parentCommit: {$ref: '#/components/schemas/CommitOid'}
        - type: object
          required: [key, value]
          properties:
            key: {const: file}
            value:
              type: object
              required: [path, content, encoding]
              properties:
                path: {type: string}
                content: {type: string}
                encoding: {const: base64}
        - type: object
          required: [key, value]
          properties:
            key: {const: lfsFile}
            value:
              type: object
              required: [path, algo, oid]
              properties:
                path: {type: string}
                algo: {const: sha256}
                oid: {$ref: '#/components/schemas/Sha256'}
                size: {type: integer}
        - type: object
          required: [key, value]
          properties:
            key: {enum: [deletedFile, deletedFolder]}
            value: {type: object, required: [path], properties: {path: {type: string}}}
    GitRef:
      type: object
      required: [name, ref, targetCommit]
      properties:
        name: {type: string}
        ref: {type: string}
        targetCommit: {$ref: '#/components/schemas/CommitOid'}
    Discussion:
      type: object
      required: [num, title, status, isPullRequest, createdAt, repo]
      properties:
        num: {type: integer}
        title: {type: string}
        status: {type: string, enum: [draft, open, closed, merged]}
        isPullRequest: {type: boolean}
        createdAt: {type: string, format: date-time}
        author: {type: object, properties: {name: {type: string}}, description: Absent for a deleted account.}
        repo: {type: object, required: [name, type], properties: {name: {type: string}, type: {type: string, enum: [model, dataset, space]}}}
        pinned: {type: boolean}
        numComments: {type: integer}
    DiscussionDetails:
      allOf:
        - {$ref: '#/components/schemas/Discussion'}
        - type: object
          required: [events]
          properties:
            events: {type: array, items: {$ref: '#/components/schemas/DiscussionEvent'}}
            changes:
              type: object
              description: Pull requests only.
              properties:
                base: {type: string}
                mergeCommitId: {type: [string, 'null']}
            filesWithConflicts: {type: array, items: {type: string}}
            diff: {type: [string, 'null']}
    DiscussionEvent:
      type: object
      required: [id, type, createdAt, data]
      properties:
        id: {type: string}
        type: {type: string, enum: [comment, status-change, commit, title-change]}
        createdAt: {type: string, format: date-time}
        author: {type: object, properties: {name: {type: string}}}
        data:
          type: object
          description: 'comment: {edited, hidden, latest: {raw}}; status-change: {status}; commit: {subject, oid}; title-change: {from, to}'
    UserOverview:
      type: object
      required: [user, type]
      properties:
        user: {type: string}
        type: {type: string, enum: [user]}
        fullname: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null']}
        details: {type: [string, 'null'], description: Bio.}
        isPro: {type: boolean}
        createdAt: {type: string, format: date-time}
        numModels: {type: integer}
        numDatasets: {type: integer}
        numSpaces: {type: integer}
        numDiscussions: {type: integer}
        numPapers: {type: integer}
        numLikes: {type: integer}
        numFollowers: {type: integer}
        numFollowing: {type: integer}
        isFollowing: {type: boolean}
        orgs: {type: array, items: {type: object, properties: {name: {type: string}, fullname: {type: string}, avatarUrl: {type: string}}}}
    OrgOverview:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {type: string, enum: [org]}
        fullname: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null']}
        details: {type: [string, 'null']}
        isVerified: {type: boolean}
        verifiedDomain: {type: [string, 'null']}
        numModels: {type: integer}
        numDatasets: {type: integer}
        numSpaces: {type: integer}
        numMembers: {type: integer}
        numFollowers: {type: integer}
        isFollowing: {type: boolean}
        catalog: {type: boolean, description: True when the name is a catalog publisher (reserved) and nobody has claimed it.}
    Collection:
      type: object
      required: [slug, title, owner, items, private, lastUpdated]
      properties:
        slug: {type: string, description: '<namespace>/<title-slug>-<id suffix>'}
        title: {type: string}
        description: {type: [string, 'null']}
        owner: {type: object, required: [name, type], properties: {name: {type: string}, type: {type: string, enum: [user, org]}}}
        items:
          type: array
          items:
            type: object
            required: [_id, type, id, position]
            properties:
              _id: {type: string, description: Item object id (ci_...).}
              type: {type: string, enum: [model, dataset, space, paper, collection]}
              id: {type: string}
              position: {type: integer}
              note: {type: object, properties: {text: {type: string}}}
        position: {type: integer}
        private: {type: boolean}
        theme: {type: [string, 'null']}
        upvotes: {type: integer}
        lastUpdated: {type: string, format: date-time}
    WebhookWatched:
      type: object
      required: [type, name]
      properties:
        type: {type: string, enum: [user, org, model, dataset, space, app]}
        name: {type: string}
    WebhookInput:
      type: object
      required: [watched, url]
      properties:
        watched: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/WebhookWatched'}}
        url: {type: string, format: uri, pattern: '^https://'}
        domains: {type: array, items: {type: string, enum: [repo, discussion]}}
        secret: {type: string, maxLength: 200}
    Webhook:
      type: object
      required: [id, url, watched, domains, disabled]
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        watched: {type: array, items: {$ref: '#/components/schemas/WebhookWatched'}}
        domains: {type: array, items: {type: string, enum: [repo, discussion]}}
        secret: {type: [string, 'null'], description: Returned to the owner only.}
        disabled: {type: boolean}
    WebhookPayload:
      description: Body POSTed to a webhook URL, with header X-Webhook-Secret when a secret is set. Hugging Face payload version 3.
      type: object
      required: [event, repo, webhook]
      properties:
        event:
          type: object
          required: [action, scope]
          properties:
            action: {type: string, enum: [create, update, delete, move]}
            scope: {type: string, description: 'repo, repo.content, repo.config, discussion, discussion.comment'}
        repo:
          type: object
          required: [type, name, id, private]
          properties:
            type: {type: string, enum: [model, dataset, space]}
            name: {type: string}
            id: {type: string}
            private: {type: boolean}
            url: {type: object, properties: {web: {type: string}, api: {type: string}}}
            headSha: {type: string}
        discussion: {type: object}
        comment: {type: object}
        webhook: {type: object, required: [id, version], properties: {id: {type: string}, version: {const: 3}}}
    Account:
      type: object
      required: [user, plan, perks, usage]
      properties:
        user: {$ref: '#/components/schemas/UserOverview'}
        plan: {type: [string, 'null'], description: Null when the plan service did not answer; perks is then empty.}
        perks: {type: object, additionalProperties: true, description: Copied from the entitlement claim. Names and values come from cloud-api.}
        addon_bytes: {type: object, properties: {public: {type: integer}, private: {type: integer}}}
        usage: {type: object, required: [public_bytes, private_bytes], properties: {public_bytes: {type: integer}, private_bytes: {type: integer}, quarantine_bytes: {type: integer, description: Reserved, being scanned or held. Counts against the cap.}, repos: {type: integer}}}
        storage_cap_bytes: {type: [integer, 'null'], description: 'The cap in force: user_cap_bytes from the limits table until perks are offered, then the claim perk. Null while unset.'}
        rules_accepted_at: {type: [string, 'null'], format: date-time, description: Null until the upload rules are accepted.}
        staff: {type: boolean}
        status: {type: string, enum: [active, suspended]}
        orgs: {type: array, items: {type: object, properties: {name: {type: string}, role: {type: string}}}}
    FollowTarget:
      type: object
      required: [type, name]
      properties:
        type: {type: string, enum: [user, org]}
        name: {$ref: '#/components/schemas/Handle'}
    Post:
      type: object
      required: [id, body, createdAt]
      properties:
        id: {type: string}
        author: {$ref: '#/components/schemas/UserRef'}
        asOrg: {type: [string, 'null']}
        body: {type: string}
        attachments: {type: array, items: {type: object, properties: {type: {type: string}, ref: {type: string}}}}
        createdAt: {type: string, format: date-time}
    Paper:
      type: object
      required: [id, title, authors, upvotes]
      properties:
        id: {type: string}
        title: {type: string}
        authors: {type: array, items: {type: string}}
        summary: {type: [string, 'null']}
        publishedAt: {type: [string, 'null'], format: date-time}
        upvotes: {type: integer}
        hasVoted: {type: boolean}
        repos: {type: array, items: {$ref: '#/components/schemas/RepoPointer'}}
    Endpoint:
      type: object
      required: [id, repo, status]
      properties:
        id: {type: string}
        repo: {$ref: '#/components/schemas/RepoPointer'}
        status: {type: string, enum: [pending, initializing, running, scaled_to_zero, failed, deleted]}
        hardware: {type: string}
        url: {type: [string, 'null'], format: uri}
