                  properties:
                    createdAt: {type: string, format: date-time}
                    repo: {type: object, required: [name, type], properties: {name: {type: string}, type: {$ref: '#/components/schemas/RepoTypeSingular'}}}
  /api/users/{user}/overview:
    get:
      tags: [community]
      operationId: userOverview
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: user, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      responses:
        '200':
          description: Public profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserOverview'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/users/{user}/followers:
    get:
      tags: [community]
      operationId: userFollowers
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: user, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      responses:
        '200': {description: Followers., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/UserRef'}}}}}
  /api/users/{user}/following:
    get:
      tags: [community]
      operationId: userFollowing
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: user, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      responses:
        '200': {description: Users the user follows., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/UserRef'}}}}}
  /api/organizations/{org}/overview:
    get:
      tags: [community]
      operationId: orgOverview
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: org, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      responses:
        '200':
          description: Public org profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgOverview'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/organizations/{org}/members:
    get:
      tags: [community]
      operationId: orgMembers
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: org, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      responses:
        '200':
          description: Members (public view; roles only for members of the org).
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - {$ref: '#/components/schemas/UserRef'}
                    - type: object
                      properties:
                        role: {type: string, enum: [read, contributor, write, admin]}
  /api/organizations/{org}/followers:
    get:
      tags: [community]
      operationId: orgFollowers
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: org, in: path, required: true, schema: {$ref: '#/components/schemas/Handle'}}
      responses:
        '200': {description: Followers., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/UserRef'}}}}}
  /api/collections:
    get:
      tags: [community]
      operationId: listCollections
      summary: Public collections, or the caller's own private ones with owner=<self>.
      security: [{}, {fwBearer: []}]
      parameters:
        - {name: owner, in: query, schema: {type: string}}
        - {name: item, in: query, schema: {type: string}, description: 'e.g. models/org/repo'}
        - {name: q, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [lastModified, trending, upvotes]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Collections., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Collection'}}}}}
    post:
      tags: [community]
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, namespace]
              properties:
                title: {type: string, minLength: 1, maxLength: 60}
                namespace: {$ref: '#/components/schemas/Handle'}
                description: {type: string, maxLength: 150}
                private: {type: boolean, default: false}
      responses:
        '200': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PerkRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/collections/{namespace}/{slug}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - {name: slug, in: path, required: true, schema: {type: string}, description: '<title-slug>-<id suffix>'}
    get:
      tags: [community]
      operationId: getCollection
      security: [{}, {fwBearer: []}]
      responses:
        '200': {description: Collection with items., content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [community]
      operationId: updateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: {type: string, maxLength: 60}
                description: {type: string, maxLength: 150}
                private: {type: boolean}
                position: {type: integer}
                theme: {type: string}
      responses:
        '200': {description: Updated., content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Collection'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [community]
      operationId: deleteCollection
      responses:
        '200': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/collections/{namespace}/{slug}/items:
    post:
      tags: [community]
      operationId: addCollectionItem
      parameters:
        - $ref: '#/components/parameters/namespace'
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item:
                  type: object
                  required: [id, type]
                  properties:
                    id: {type: string, description: 'org/repo for repos, arXiv id for papers, collection slug for collections'}
                    type: {type: string, enum: [model, dataset, space, app, paper, collection]}
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: Added; the updated collection., content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/collections/{namespace}/{slug}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - {name: slug, in: path, required: true, schema: {type: string}}
      - {name: itemId, in: path, required: true, schema: {type: string, pattern: '^ci_[0-9A-Za-z]+$'}}
    patch:
      tags: [community]
      operationId: updateCollectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, minProperties: 1, properties: {note: {type: string, maxLength: 500}, position: {type: integer}}}
      responses:
        '200': {description: Updated.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [community]
      operationId: deleteCollectionItem
      responses:
        '200': {description: Removed.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ---------------------------------------------------------------------------------------------- webhooks
