  # ------------------------------------------------------------------------------------- Allternit-only stubs
  /api/fw/v1/account:
    get:
      tags: [allternit]
      operationId: getAccount
      summary: The caller's profile, plan, perks (as the claim states them) and storage use.
      responses:
        '200': {description: Account., content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Signed in but no Freeweights profile yet (profile_not_found; pick a handle with POST)., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      tags: [allternit]
      operationId: createAccount
      summary: First sign-in. Picks the handle. 409 handle_taken for a taken or reserved handle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: {$ref: '#/components/schemas/Handle'}
                name: {type: string}
                acceptRules: {type: boolean, const: true, description: Accepts the upload rules (policy/community-rules.md) and sets rules_accepted_at. Uploads need it.}
      responses:
        '200': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
    patch:
      tags: [allternit]
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                handle: {$ref: '#/components/schemas/Handle'}
                name: {type: string, maxLength: 100}
                bio: {type: string, maxLength: 2000}
                homepage: {type: string, format: uri}
                avatarUrl: {type: string, format: uri}
                acceptRules: {type: boolean, const: true, description: Accepts the upload rules (sets rules_accepted_at once; sending it again keeps the first time).}
      responses:
        '200': {description: Updated., content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [allternit]
      operationId: deleteAccount
      summary: Delete the Freeweights profile, its repos and webhooks. Discussions and comments stay, shown as a deleted account.
      description: |
        The account's repos are marked `removed` with `removed_reason = account_deleted` at once (their files
        stop being served; resolve answers 404) and their bytes are released from storage_usage and the site
        total when the files are deleted.
      responses:
        '200': {description: Deleted.}
  /api/fw/v1/follows:
    get:
      tags: [allternit]
      operationId: listFollows
      parameters:
        - {name: user, in: query, schema: {$ref: '#/components/schemas/Handle'}, description: Default the caller.}
      responses:
        '200': {description: Who the user follows., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FollowTarget'}}}}}
    post:
      tags: [allternit]
      operationId: follow
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [target], properties: {target: {$ref: '#/components/schemas/FollowTarget'}}}}}}
      responses:
        '200': {description: Following.}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [allternit]
      operationId: unfollow
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [target], properties: {target: {$ref: '#/components/schemas/FollowTarget'}}}}}}
      responses:
        '200': {description: Not following.}
