      parameters:
        - {name: author, in: query, schema: {type: string}}
        - {name: feed, in: query, schema: {type: string, enum: [recent, following]}, description: following needs a credential.}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Posts., content: {application/json: {schema: {type: object, required: [posts], properties: {posts: {type: array, items: {$ref: '#/components/schemas/Post'}}, next: {type: [string, 'null']}}}}}}
    post:
      tags: [allternit]
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 10000}
                asOrg: {$ref: '#/components/schemas/Handle'}
                attachments: {type: array, maxItems: 10, items: {type: object, required: [type, ref], properties: {type: {type: string, enum: [repo, paper, image]}, ref: {type: string}}}}
      responses:
        '200': {description: Posted., content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
  /api/fw/v1/posts/{postId}:
    parameters:
      - {name: postId, in: path, required: true, schema: {type: string, pattern: '^pst_[0-9A-Za-z]+$'}}
    get:
      tags: [allternit]
      operationId: getPost
      security: [{}, {fwBearer: []}]
      responses:
        '200': {description: Post., content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [allternit]
      operationId: deletePost
      responses:
        '200': {description: Deleted.}
