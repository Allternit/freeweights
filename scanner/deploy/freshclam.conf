# freshclam for fw-scanner: the scanner runs it from its poll loop every FRESHCLAM_EVERY_HOURS (no
# clamav-freshclam daemon, no cron). Installed as /etc/fw-scanner/freshclam.conf (0644).
DatabaseDirectory /var/lib/fw-scanner/clamav
DatabaseMirror database.clamav.net
Foreground yes
LogSyslog no
LogTime yes
NotifyClamd no
ConnectTimeout 30
ReceiveTimeout 300
